distribution: source_and_selected_results
source_repository:
  url: https://github.com/josepsuy/LPR-GNN
  visibility: private
  access: owner_granted
  contents: source_configuration_minimal_notebooks_split_metadata_reference_schedules_and_selected_results
  excludes: raw_instances_generated_graphs_and_unselected_runtime_outputs
status: selected_results_and_inference_weights_bundled
environment:
  python: '3.11.15'
  python_version_file: .python-version
  dependencies: requirements.txt
  dependency_scope: pinned_direct_dependencies_not_a_transitive_lockfile
  torch: 2.5.1+cu121
configuration_file: config.yaml
split_manifest: instance_splits.json
input_source_recipe: instance_sources.json
input_preparation_command: python prepare_instances.py
input_integrity: pinned_archive_source_member_and_prepared_file_sha256
input_conversion: deterministic_public_PSPLIB_and_original_RCPLIB_v2_4
benchmark_source_recipe: benchmark_sources.json
benchmark_preparation_command: python prepare_benchmarks.py
dataset_guide: DATASETS.md
datasets:
  bundled_raw_instances: false
  supported_families: [j30, j60, j90, j120, PACK, RG30, RG300]
  psplib: https://www.om-db.wi.tum.de/psplib/
  rg_library: https://github.com/MarioVanhoucke/RCPLIB-Resource-Constrained-Project-Library/releases/latest
  pack_source_status: verified_public_MiniZinc_mirror_with_pinned_commit_and_file_checksums
architecture:
  type: shared_GRU
  iterations: 16
  parameters: 41514
  temporal_scales: [1, 8, 64, 512]
  temporal_edges: bidirectional
normalization:
  temporal: log1p_fixed_reference_no_clip
  temporal_reference: 100.0
  resources: instance_capacity_ratio
training:
  epochs: 24
  graphs_per_epoch: 0
  variants: no_resource_permutation
  shuffle: seed_plus_epoch
  skip_singleton_border_graphs: true
evaluation:
  data: original_RCPSP_instances
  method: deterministic_SSGS_rollouts
  checkpoint_selection: minimum_validation_mean_makespan
  test: after_training_with_validation_selected_checkpoint
  singleton_border: bypass_graph_construction_and_GNN
paths:
  training_inputs: source_data
  raw_benchmarks: rcpsp
  training_graphs: data/train
  validation_instances: data/validation
  test_instances: data/test
  generated_outputs: outputs/run
notebooks:
  - create_graphs_training.ipynb
  - training.ipynb
  - makespan_predictor.ipynb
project_distribution:
  paths: relative_to_repository_root
  results: paper_results
  result_methods: [LPR-GNN, handcrafted_priority_rules, Wheatley]
  other_priority_rule_results: paper_results/other_priority_rules_results.csv
  inference_weights: paper_results/best.pt
  inference_weights_model: LPR-GNN_base
  result_provenance: paper_results/manifest.json
  third_party_data_rights: obtain_separately_and_follow_provider_terms

resource_augmentation_update:
  date: "2026-10-17"
  training_variant_policy: no_resource_permutation
  generated_variants: [original, duration_scaled]
  archived_variant_order: [original, resource_permuted, duration_scaled]
  archived_graphs_per_epoch: 401778
  selected_graphs_per_epoch: 267852
  reported_checkpoints: trained_with_archived_three_variant_corpus
  retrained_with_reduced_corpus: false
